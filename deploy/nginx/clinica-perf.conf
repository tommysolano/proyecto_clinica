# =============================================================================
#  Ajustes de RENDIMIENTO de nginx para Shiluv — /etc/nginx/conf.d/clinica-perf.conf
# =============================================================================
#
#  POR QUÉ EXISTE ESTE FICHERO
#  ---------------------------
#  Medido contra producción el 30-jul-2026, el frontend se servía SIN COMPRIMIR:
#
#      GET /assets/index-*.js  →  Content-Length: 2 661 373   (8,5 s de descarga)
#      GET /assets/index-*.css →  Content-Length:   156 225
#
#  …y eso PIDIÉNDOLO con `Accept-Encoding: gzip`. La causa: el nginx.conf de
#  Ubuntu trae `gzip on;` pero deja `gzip_types` comentado, así que solo comprime
#  `text/html`. El index.html sí viajaba gzipeado — el bundle de 2,6 MB no.
#  Comprimido son ~600 KB: se descargan 2,2 MB de más en CADA carga en frío.
#
#  Además no había NI `Cache-Control` NI `Expires` en /assets (solo `ETag`), así
#  que el navegador revalidaba cada fichero en cada carga aunque no hubiera
#  cambiado nada. Como Vite ya pone un hash en el nombre del fichero
#  (`index-BEgAzmVQ.js`), esos ficheros son inmutables por definición y se pueden
#  cachear un año: si cambia el contenido, cambia el nombre.
#
#  POR QUÉ ES UN FICHERO APARTE Y NO UNA EDICIÓN DEL SITIO
#  ------------------------------------------------------
#  El bloque `server` de app.shiluvecuador.com lo REESCRIBE certbot cada vez que
#  renueva el certificado. Tocarlo a mano es arriesgado (un error ahí tumba el
#  HTTPS de toda la clínica). Todo lo de aquí vive en el contexto `http`, se
#  aplica solo y sobrevive a las renovaciones.
#
#  ÚNICA excepción: HTTP/2 no se puede activar desde aquí en nginx 1.24 (la
#  directiva `http2 on;` es de nginx ≥ 1.25.1). Requiere añadir `http2` a la
#  línea `listen 443 ssl;` del sitio — lo hace `aplicar-perf-nginx.sh` con copia
#  de seguridad y verificación previa.
#
#  INSTALACIÓN:  bash deploy/nginx/aplicar-perf-nginx.sh
# =============================================================================

# -----------------------------------------------------------------------------
# 1. COMPRESIÓN
# -----------------------------------------------------------------------------
gzip              on;
gzip_vary         on;          # avisa a las cachés intermedias que varía por Accept-Encoding
gzip_proxied      any;         # comprime también lo que viene del proxy (el API de Node)
gzip_comp_level   6;           # 6 = el punto dulce; 9 gasta bastante más CPU por ~2% menos
gzip_min_length   1024;        # por debajo de 1 KB comprimir sale a perder
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    application/vnd.ms-fontobject
    image/svg+xml
    font/ttf
    font/otf;
# OJO: `text/html` NO se pone — nginx lo comprime siempre y listarlo da un aviso
# de duplicado. Tampoco se ponen imágenes/vídeo/audio: ya vienen comprimidos y
# gzip solo gastaría CPU (el backend hace lo mismo en server/index.js).

# -----------------------------------------------------------------------------
# 2. CACHÉ DE LOS ESTÁTICOS CON HASH
# -----------------------------------------------------------------------------
# Se resuelve con un `map` en vez de con un `location` porque un `location` solo
# puede vivir DENTRO del bloque `server` (el de certbot). El `map` calcula el
# valor según la URL y `add_header` lo aplica; cuando la variable queda vacía
# nginx NO añade la cabecera (comportamiento documentado desde 1.7.5), así que
# el HTML y el API no se ven afectados.
map $uri $clinica_cache_control {
    default                    "";
    # Ficheros con hash en el nombre → inmutables → un año, sin revalidar.
    ~^/assets/                 "public, max-age=31536000, immutable";
    # El index.html NUNCA se cachea: es el que apunta a los assets nuevos tras un
    # deploy. Si se cachea, el navegador sigue pidiendo el bundle viejo y aparece
    # el clásico "no veo los cambios" con la página vieja conviviendo con la nueva.
    ~^/index\.html$            "no-cache";
    ~^/$                       "no-cache";
}
add_header Cache-Control $clinica_cache_control always;

# -----------------------------------------------------------------------------
# 3. LÍMITE DE SUBIDA
# -----------------------------------------------------------------------------
# El backend acepta `express.json({ limit: '50mb' })` porque la media del chat
# viaja como data URL base64 dentro del JSON. Con el límite de nginx por debajo,
# nginx corta la subida con un 413 ANTES de que Node la vea: un vídeo de 32 MB
# fallaba sin explicación. Se pone en el contexto http para que valga en todos
# los sitios sin tocar el bloque de certbot.
client_max_body_size 50m;
