# =============================================================================
#  Ajustes de RENDIMIENTO de nginx para Shiluv — /etc/nginx/conf.d/clinica-perf.conf
# =============================================================================
#
#  POR QUÉ EXISTE ESTE FICHERO
#  ---------------------------
#  Medido contra producción el 30-jul-2026, el frontend se servía SIN COMPRIMIR:
#
#      GET /assets/index-*.js  →  Content-Length: 2 661 373   (8,5 s de descarga)
#      GET /assets/index-*.css →  Content-Length:   156 225
#
#  …y eso PIDIÉNDOLO con `Accept-Encoding: gzip`. La causa: el nginx.conf de
#  Ubuntu trae `gzip on;` pero deja `gzip_types` COMENTADO, así que solo comprime
#  `text/html`. El index.html sí viajaba gzipeado — el bundle de 2,6 MB no.
#  Comprimido son ~600 KB: se descargaban 2,2 MB de más en CADA carga en frío.
#
#  Además no había NI `Cache-Control` NI `Expires` en /assets (solo `ETag`), así
#  que el navegador revalidaba cada fichero en cada carga aunque no cambiara nada.
#  Como Vite ya pone un hash en el nombre (`index-BEgAzmVQ.js`), esos ficheros son
#  inmutables por definición: si cambia el contenido, cambia el nombre.
#
#  POR QUÉ ES UN FICHERO APARTE Y NO UNA EDICIÓN DEL SITIO
#  ------------------------------------------------------
#  El bloque `server` lo REESCRIBE certbot cada vez que renueva el certificado.
#  Tocarlo a mano es arriesgado (un error ahí tumba el HTTPS de toda la clínica).
#  Todo lo de aquí vive en el contexto `http`, se aplica solo y sobrevive a las
#  renovaciones.
#
#  ⚠️ DIRECTIVAS DUPLICADAS
#  ------------------------
#  Este fichero se incluye DENTRO del bloque `http` de nginx.conf. Si una misma
#  directiva ya está declarada ahí, nginx NO se queda con la más interna: aborta
#  con «"gzip" directive is duplicate» y no arranca. Pasó en el primer intento del
#  30-jul-2026, porque el nginx.conf de Ubuntu ya trae `gzip on;`.
#  Por eso `aplicar-perf-nginx.sh` comenta automáticamente, en la copia instalada,
#  las directivas que ya estén activas en nginx.conf. Cada directiva va en UNA
#  sola línea justamente para que ese comentado automático sea seguro.
#
#  INSTALACIÓN:  sudo bash deploy/nginx/aplicar-perf-nginx.sh
# =============================================================================

# -----------------------------------------------------------------------------
# 1. COMPRESIÓN
# -----------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
# `text/html` NO se lista: nginx lo comprime siempre y ponerlo da un aviso de
# duplicado. Tampoco imágenes/vídeo/audio: ya vienen comprimidos y gzip solo
# gastaría CPU (el backend hace lo mismo en server/index.js).
gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/rss+xml application/manifest+json application/vnd.ms-fontobject image/svg+xml font/ttf font/otf;

# -----------------------------------------------------------------------------
# 2. CACHÉ DE LOS ESTÁTICOS CON HASH
# -----------------------------------------------------------------------------
# Se resuelve con un `map` y no con un `location` porque un `location` solo puede
# vivir DENTRO del bloque `server` (el de certbot). El `map` calcula el valor
# según la URL y `add_header` lo aplica; cuando la variable queda vacía nginx NO
# añade la cabecera (documentado desde 1.7.5), así que el HTML y el API no se ven
# afectados.
map $uri $clinica_cache_control {
    default                    "";
    # Ficheros con hash en el nombre → inmutables → un año, sin revalidar.
    ~^/assets/                 "public, max-age=31536000, immutable";
    # El index.html NUNCA se cachea: es quien apunta a los assets nuevos tras un
    # deploy. Si se cachea, el navegador sigue pidiendo el bundle viejo y aparece
    # el clásico "no veo los cambios", con la página vieja conviviendo con la nueva.
    ~^/index\.html$            "no-cache";
    ~^/$                       "no-cache";
    # PWA. El service worker se revalida SIEMPRE: es el fichero que decide qué se
    # cachea en el móvil, y una copia vieja pegada en el navegador dejaría a la
    # clínica con reglas de caché caducadas sin forma de corregirlo desde aquí.
    # El manifiesto va igual para que un cambio de nombre o de icono se vea ya.
    ~^/sw\.js$                 "no-cache";
    ~^/manifest\.json$         "no-cache";
}
add_header Cache-Control $clinica_cache_control always;

# -----------------------------------------------------------------------------
# 3. LÍMITE DE SUBIDA
# -----------------------------------------------------------------------------
# El backend acepta `express.json({ limit: '50mb' })` porque la media del chat
# viaja como data URL base64 dentro del JSON. Con el límite de nginx por debajo,
# nginx corta la subida con un 413 ANTES de que Node la vea: un vídeo de 32 MB
# fallaba sin explicación.
client_max_body_size 50m;
