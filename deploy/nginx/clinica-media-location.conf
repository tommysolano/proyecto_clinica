# Incluir DENTRO del bloque `server` HTTPS del CRM.
# Debe coincidir con MEDIA_X_ACCEL_PREFIX=/_clinica_media del backend.
# `internal` impide que alguien use esta ruta para leer archivos directamente:
# solo una respuesta autorizada de Node puede redirigir internamente hacia aquí.
location ^~ /_clinica_media/ {
    internal;
    alias /var/www/clinica/server/storage/media/;
    sendfile on;
    tcp_nopush on;
}
