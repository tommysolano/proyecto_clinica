name: Deploy a VPS

# Se ejecuta automaticamente en cada push a la rama main.
on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña "Actions" de GitHub.
  workflow_dispatch:

# Evita que dos despliegues corran a la vez si haces varios push seguidos.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH en el VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          # La contraseña de sudo del usuario del deploy: el paso 3b/6 de deploy.sh
          # la usa para aplicar el límite de subida de nginx (el 25m de fábrica
          # mataba con 413 toda subida de más de 25 MB). Si el secret no existe,
          # VPS_SUDO_PASS queda vacío y deploy.sh se lo salta sin más.
          envs: VPS_SUDO_PASS
          # Primero traemos el codigo (esto baja/actualiza el propio deploy.sh en
          # el VPS, asi el primer despliegue tambien funciona) y luego lo corremos.
          script: |
            cd /var/www/clinica
            git fetch --all --prune
            git reset --hard origin/main
            bash deploy.sh

      # AQUÍ ESTABA EL AGUJERO (sep-2026): el límite de subida de archivos vive en
      # nginx (`client_max_body_size`) y SOLO root puede tocarlo. El deploy corre
      # como VPS_USER (clinica), que no tiene sudo sin contraseña hacia root, así
      # que el paso 3b/6 de deploy.sh NUNCA pudo aplicar el script: nginx siguió
      # con su 25m de fábrica y toda subida de más de 25 MB moría con 413
      # («archivo demasiado grande») en el chat, en workflows y en las fichas.
      #
      # Este paso entra DIRECTAMENTE como root (misma llave, PermitRootLogin
      # prohibit-password es el default de Ubuntu) y lo aplica, y de paso verifica
      # el límite EFECTIVO con `nginx -T`. Si la llave no está autorizada para
      # root, el paso se marca como advertencia y queda la instrucción para la
      # consola del droplet (DigitalOcean → Access → Launch Droplet Console).
      - name: Límite de subida de nginx (como root)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            if [ "$(id -u)" != "0" ]; then
              echo "AVISO: la llave SSH del secret VPS_SSH_KEY no está autorizada para root."
              echo "      Aplicar UNA vez a mano desde la consola del droplet (DigitalOcean → Droplet →"
              echo "      Access → Launch Droplet Console, entra como root):"
              echo "         bash /var/www/clinica/deploy/nginx/aplicar-perf-nginx.sh"
              echo "      (o crear el secret VPS_SUDO_PASS con la contraseña de sudo del usuario del deploy)."
              exit 1
            fi
            cd /var/www/clinica
            git fetch --all --prune || true
            git reset --hard origin/main || true
            bash deploy/nginx/aplicar-perf-nginx.sh
            echo '===== límite efectivo tras aplicar ====='
            nginx -T 2>/dev/null | grep -oE 'client_max_body_size[[:space:]]+[^;]+' | sort -u
            # Prueba REAL: un POST de 30 MB no debe morir con 413 (400 = llegó a Node).
            dd if=/dev/zero of=/tmp/prueba30mb.bin bs=1M count=30 2>/dev/null
            printf 'Subida de 30 MB -> HTTP '
            curl -sS -o /dev/null -w '%{http_code}\n' -X POST -H 'Content-Type: application/json' \
              --data-binary @/tmp/prueba30mb.bin https://app.shiluvecuador.com/api/auth/login
            rm -f /tmp/prueba30mb.bin
