name: Probe VPS permisos

# Temporal (sep-2026): diagnostico del 413 y de los reinicios en bucle del backend.
# Se borra al resolver.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reproducir 502 via nginx y capturar la causa
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 10m
          script: |
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            echo '===== config real de pm2 ====='
            sudo -n -iu clinica pm2 describe clinica-api 2>&1 | grep -iE 'memory|uptime|restarts|exec|interpreter|node_args' || true
            echo '===== NODE_ARGS / max-old-space del proceso vivo ====='
            ps aux | grep 'server/index.js' | grep -v grep || true
            cat /proc/$(pgrep -f 'server/index.js' | head -1)/cmdline 2>/dev/null | tr '\0' ' '; echo
            echo '===== oom del kernel (arreglado) ====='
            ( dmesg -T 2>/dev/null || journalctl -k --no-pager -n 5000 2>/dev/null ) | grep -iE 'killed process|oom' | tail -n 20
            echo "fin-oom"
            echo '===== generar 120MB ====='
            printf '{"a":1,"b":"' > /tmp/big.json
            head -c 125829000 /dev/zero | tr '\0' 'x' >> /tmp/big.json
            printf '"}' >> /tmp/big.json
            echo '===== ANTES ====='
            sudo -n -iu clinica pm2 pid clinica-api 2>&1 || true
            echo '===== 120MB VIA NGINX ====='
            curl -sS -o /dev/null -w 'via-nginx-120MB -> HTTP %{http_code} T:%{time_total}\n' --max-time 240 -X POST -H 'Content-Type: application/json' --data-binary @/tmp/big.json https://app.shiluvecuador.com/api/auth/login
            sleep 5
            echo '===== DESPUES ====='
            sudo -n -iu clinica pm2 status 2>&1 | head -10 || true
            echo '===== ultimas 60 lineas error ====='
            tail -n 60 ~/.pm2/logs/clinica-api-error-0.log 2>/dev/null || true
            echo '===== nginx error log (colas) ====='
            tail -n 15 /var/log/nginx/error.log 2>/dev/null || echo 'sin permiso para leer error.log'
            rm -f /tmp/big.json
