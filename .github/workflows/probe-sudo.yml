name: Probe VPS permisos

# Temporal (sep-2026): diagnostico del 413 y de los reinicios en bucle del backend.
# Se borra al resolver.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prueba controlada de body grande desde el propio VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 10m
          script: |
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            echo '===== TODOS los procesos node/pm2 (a ver si hay un 2do backend) ====='
            ps aux | grep -E 'node|PM2|God' | grep -v grep || true
            echo '===== quien escucha el 5000 ====='
            ss -tlnp 2>/dev/null | grep ':5000' || true
            echo '===== marcar la hora ====='
            date -u +%H:%M:%S
            echo '===== generar body de 120 MB y probar CONTRA LOCALHOST:5000 (sin nginx) ====='
            head -c 125829120 /dev/zero | tr '\0' 'x' > /tmp/big.json
            printf '{"a":1,"b":"' > /tmp/big.json
            head -c 125829000 /dev/zero | tr '\0' 'x' >> /tmp/big.json
            printf '"}' >> /tmp/big.json
            ls -l /tmp/big.json
            curl -sS -o /dev/null -w 'localhost -> HTTP %{http_code} T:%{time_total}\n' --max-time 120 -X POST -H 'Content-Type: application/json' --data-binary @/tmp/big.json http://localhost:5000/api/auth/login
            sleep 3
            echo '===== logs de error tras la prueba ====='
            tail -n 30 ~/.pm2/logs/clinica-api-error-0.log 2>/dev/null || true
            echo '===== logs de out tras la prueba ====='
            tail -n 15 ~/.pm2/logs/clinica-api-out-0.log 2>/dev/null || true
            echo '===== pm2 status ====='
            sudo -n -iu clinica pm2 status 2>&1 | head -12 || true
            echo '===== probar CONTRA NGINX (30MB) ====='
            head -c 31457280 /dev/zero | tr '\0' 'y' > /tmp/med.json
            curl -sS -o /dev/null -w 'via-nginx -> HTTP %{http_code} T:%{time_total}\n' --max-time 120 -X POST -H 'Content-Type: application/json' --data-binary @/tmp/med.json https://app.shiluvecuador.com/api/auth/login
            rm -f /tmp/big.json /tmp/med.json
